[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidgrep"
version = "0.0.1"
description = "Scan videos for text or image templates and extract matching clips."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "easyocr>=1.7.0",
    "opencv-python>=4.9.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
tui = [
    "textual>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
vidgrep = "vidgrep.main:main"
vidgrep-region = "vidgrep.select_region:main"
vidgrep-tui = "vidgrep.tui:main"

[tool.setuptools]
packages = ["vidgrep"]
